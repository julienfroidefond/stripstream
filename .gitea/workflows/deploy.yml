name: Deploy with Docker Compose

on:
  push:
    branches:
      - main # adapte la branche que tu veux déployer

jobs:
  deploy:
    runs-on: mac-orbstack-runner # le nom que tu as donné au runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy stack
        run: |
          docker compose up -d --build
