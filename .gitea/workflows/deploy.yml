name: Build, Push & Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: julienfroidefond32/stripstream

jobs:
  deploy:
    runs-on: mac-orbstack-runner
    # Skip non-runtime commits (chore, docs, style, test, ci, build) - same
    # types that the auto-bump hook ignores. Spares a build when only tooling,
    # docs or formatting changes.
    if: |
      !startsWith(github.event.head_commit.message, 'chore') &&
      !startsWith(github.event.head_commit.message, 'docs') &&
      !startsWith(github.event.head_commit.message, 'style') &&
      !startsWith(github.event.head_commit.message, 'test') &&
      !startsWith(github.event.head_commit.message, 'ci') &&
      !startsWith(github.event.head_commit.message, 'build')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from package.json and short SHA
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          sha=$(git rev-parse --short HEAD)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Detected version: $v ($sha)"

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ steps.version.outputs.version }} \
            -t ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }} \
            .

      - name: Push to DockerHub
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          docker push ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}

      - name: Pull new image and restart container
        run: |
          docker pull ${{ env.IMAGE }}:latest
          cd /Users/julienfroidefond/Sites/docker-stack
          ./scripts/stack.sh up stripstream

      - name: Cleanup old images
        run: |
          docker image prune -f
          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "julienfroidefond32/stripstream" \
            | grep -vE ":(latest|buildcache)$" \
            | xargs -r docker rmi -f || true
