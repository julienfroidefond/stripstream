version: "3.8"

services:
  stripstream-app:
    image: julienfroidefond32/stripstream:latest
    build:
      context: .
      dockerfile: Dockerfile
      # No secret as a build arg: the Dockerfile declares no ARG for it and a
      # build arg would end up in the image history. The admin password is a
      # runtime variable only (see environment below).
      args:
        - NODE_ENV=${NODE_ENV}
    container_name: stripstream-app
    restart: unless-stopped
    ports:
      - "3020:3000"
    volumes:
      - stripstream_cache:/app/.cache
      - ${PRISMA_DATA_PATH:-./prisma/data}:/app/prisma/data
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=file:/app/prisma/data/stripstream.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Mandatory: provider credentials are encrypted at rest with this key.
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:?Set CREDENTIALS_ENCRYPTION_KEY (openssl rand -base64 32)}
      # Self-service sign-up is closed unless explicitly set to "true".
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-false}
      - AUTH_TRUST_HOST=true
      - KOMGA_MAX_CONCURRENT_REQUESTS=5
      # Only used to create the admin account on first boot (no default value).
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-}
      - PRISMA_DATA_PATH=${PRISMA_DATA_PATH:-./prisma/data}
    networks:
      - stripstream-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  stripstream-network:
    driver: bridge

volumes:
  stripstream_cache:
