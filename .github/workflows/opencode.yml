name: opencode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue/PR. A newer event supersedes the previous run instead of
# queueing behind it: without this, a single wedged run blocks every further
# `/oc` mention on that thread until the job timeout.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Husky's `prepare` hook is meaningless (and noisy) on CI.
  HUSKY: 0
  # `external_directory` and `doom_loop` default to "ask". In a non-interactive
  # CI run nobody can answer, so a single out-of-workspace path hangs the agent
  # until the job timeout (observed on 2026-10-19: 53 min of silence at
  # `/home/runner/work/work/...`). Deny instead: the tool fails fast and the
  # agent recovers. /tmp stays writable for scratch files.
  OPENCODE_CONFIG_CONTENT: >-
    {"permission":{"external_directory":{"*":"deny","/tmp/**":"allow"},"doom_loop":"deny"}}

jobs:
  issue:
    name: Implement labeled issue
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'ai' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # install + lint + typecheck + unit tests + build on a warm cache takes
    # ~10–15 min; the E2E suite adds a production build of its own. Cap the job
    # so a wedged agent fails fast instead of holding the concurrency group.
    timeout-minutes: 60
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `postinstall` runs `prisma generate`, so the generated client is ready
      # before lint/typecheck/build.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright tests start a browser; without it every E2E journey fails
      # for infrastructure reasons, which is a false green/red for the agent.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          prompt: |
            Implement the GitHub issue this event refers to.

            - Read the full issue, including all comments, for context and acceptance criteria.
            - Follow the repository conventions in AGENTS.md.
            - Add or update tests for any behavior change.
            - The runner provisions Node 24, pnpm and the Playwright Chromium browser,
              so `pnpm test:unit` and `pnpm test:e2e` are expected to pass as-is. If they
              fail to start, the infrastructure is broken — report it instead of
              rewriting the tests.
            - Run `pnpm lint`, `pnpm typecheck`, `pnpm test:unit` and `pnpm build` before finishing.
            - Create a dedicated branch and open a pull request that references the issue with `Closes #<number>`.
            - Never merge and never push directly to `main`.
            - If the issue is ambiguous or requires a product decision, comment on the issue with your questions instead of guessing.

  comment:
    name: Reply to mention
    if: |
      github.event_name != 'issues' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
