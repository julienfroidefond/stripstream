name: opencode

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue/PR. A newer event supersedes the previous run instead of
# queueing behind it: without this, a single wedged run blocks every further
# `/oc` mention on that thread until the job timeout.
#
# The agent posts "Created PR #N" itself when it finishes. That issue_comment
# event used to land in the same group and cancelled the run that had just
# opened the PR, in the middle of its post-steps: successful runs were reported
# as "cancelled" for this reason. Bot-triggered runs therefore get a throwaway
# group, so they can never cancel real work.
concurrency:
  group: >-
    opencode-${{ github.event.sender.type == 'Bot'
    && format('noop-{0}', github.run_id)
    || github.event.issue.number
    || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Husky's `prepare` hook is meaningless (and noisy) on CI.
  HUSKY: 0
  # `external_directory` and `doom_loop` default to "ask". In a non-interactive
  # CI run nobody can answer, so a single out-of-workspace path hangs the agent
  # until the job timeout (observed on 2026-10-19: 53 min of silence at
  # `/home/runner/work/work/...`). Deny instead: the tool fails fast and the
  # agent recovers. /tmp stays writable for scratch files.
  OPENCODE_CONFIG_CONTENT: >-
    {"permission":{"external_directory":{"*":"deny","/tmp/**":"allow"},"doom_loop":"deny"}}

jobs:
  issue:
    name: Implement labeled issue
    if: |
      github.event_name == 'issues' &&
      github.event.label.name == 'ai' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # install + lint + typecheck + unit tests + build on a warm cache takes
    # ~10–15 min; the E2E suite adds a production build of its own, and the agent
    # itself works 20–45 min on top of that. Cap the job so a wedged agent fails
    # fast instead of holding the concurrency group.
    timeout-minutes: 90
    # `issues` is a low-trust trigger: GitHub hands the job a read-only cache
    # token ("Cache mode: read" / "cache write denied: token has no writable
    # scopes"), so neither the pnpm store nor the OpenCode CLI cache is ever
    # saved. `cache-mode: write` opts this job out of the read-only default.
    # Do not add `actions: write` for this: cache access is enforced with scoped
    # cache tokens, and a job with only `contents: read` saves caches fine (see
    # ci.yml). See .github/workflows/README.md#caches.
    cache-mode: write
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: diffs are taken against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # `postinstall` runs `prisma generate`, so the generated client is ready
      # before lint/typecheck/build.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright tests start a browser; without it every E2E journey fails
      # for infrastructure reasons, which is a false green/red for the agent.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
          prompt: |
            Implement the GitHub issue this event refers to.

            ## Before coding
            - Read the full issue, including all comments, and restate the acceptance
              criteria as a checklist.
            - Read AGENTS.md and the docs/ file covering every area you touch.
            - If the issue spans several independent surfaces, or would touch more than
              ~15 files, comment on the issue with a proposed split and stop.
            - Search for existing code first (`rg`, and `semble` if available): helpers,
              server actions, provider methods, hooks, cache tags, UI primitives. Reuse or
              extend them. Never copy-paste an existing provider call, cache tag, server
              action or component; if duplication is unavoidable, justify it in the PR
              body.

            ## Implementation
            - Follow AGENTS.md: server-first (RSC + server actions), small cohesive
              modules, no dead code, no unrelated reformatting.
            - Reach the media backend only through `getProvider()`; never import
              `KomgaProvider` or `StripstreamProvider` directly.
            - Keep mutations in `src/app/actions/`; client components only for
              browser-only concerns.
            - New user-facing copy goes in both `src/i18n/messages/en/common.json` and
              `src/i18n/messages/fr/common.json`. New errors use `AppError`, a code from
              `src/constants/errorCodes.ts` and an `errors.${CODE}` message.
            - Update `docs/` when user-visible behavior or the API surface changes.
            - Add tests for the nominal path, the empty/no-op path, the edge states that
              actually exist (for example a book with no read progress, or a favorite
              scoped to another config), and the error path. Put pure logic in Vitest
              tests next to the source (`src/**/*.test.ts`) and user-facing flows in
              `tests/`. Name them in the PR body.

            ## Validation (must pass before you finish)
            - `pnpm lint` (0 warnings)
            - `pnpm typecheck`
            - `pnpm test:unit`
            - `pnpm build`
            - If you touched a user-facing route: `pnpm test:e2e`. The runner provisions
              Node 24, pnpm and the Playwright Chromium browser; if the suite cannot
              start, the infrastructure is broken — report it instead of rewriting the
              tests.
            - If a test fails for reasons unrelated to your change, name it and show that
              it also fails on the base commit.

            ## Self-review before finishing
            Stage everything (`git add -A`) so new files appear in the diff, then re-read
            `git diff origin/main` (the checkout has full history). Then delegate a second
            review to the `reviewer` subagent: give it the issue's acceptance criteria and
            the base ref (`origin/main`); it can read the diff itself. Ask for findings
            with `file:line`. Address every finding, or justify in the final response why
            it does not apply.
            Check the same axes yourself and fix what you find:
            - duplication: is there an existing helper, server action, provider method,
              hook, cache tag or UI primitive that should have been reused or factored out?
            - dead code: unused imports or variables, unreachable branches, debug output;
            - contracts: provider interface changes mirrored in both implementations,
              route handlers and `docs/api.md` agree, Prisma schema/migrations match the
              code;
            - conventions: cache invalidated at the right tag scope, localStorage keys
              scoped with `buildStorageKey`, secrets never logged, i18n keys in both en
              and fr;
            - completeness: every acceptance criterion has code and tests;
            - scope: no unrelated changes, no version bump, no formatting noise.

            ## Pull request
            - Do not create a branch, commit, push or open the pull request yourself: the
              runner does that after you finish, and uses your final response as the PR
              body.
            - Make the final response the PR body, with these sections: Contexte,
              Changement, Réutilisation (existing code reused), Tests (names), Commandes
              exécutées, Points d'attention / hors périmètre.
            - Never push directly to `main`.
            - If the issue is ambiguous or requires a product decision, stop and explain
              the decision needed instead of guessing.

  comment:
    name: Reply to mention
    if: |
      github.event_name != 'issues' &&
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same as the `issue` job: `issue_comment` / `pull_request_review_comment`
    # are low-trust triggers, so the cache stays read-only unless the job asks
    # for `cache-mode: write`. See .github/workflows/README.md#caches.
    cache-mode: write
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: diffs are taken against origin/main.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          variant: max
